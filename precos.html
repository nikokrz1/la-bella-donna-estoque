<title>Preços de Insumos</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

  :root {
    --bg: #f5f4ee;
    --bg-raised: #ffffff;
    --ink: #23271f;
    --ink-soft: #5b6157;
    --border: #dedad0;
    --accent: #2c6b5e;
    --accent-soft: #e3efe9;
    --accent-ink: #0f3a30;
    --chip-bg: #eceae1;
    --shadow: 0 1px 2px rgba(35,39,31,0.06), 0 4px 14px rgba(35,39,31,0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1d19; --bg-raised: #24261f; --ink: #ece9e0; --ink-soft: #a5a99c;
      --border: #383b32; --accent: #6cc4ac; --accent-soft: #23342d; --accent-ink: #a9e6d1;
      --chip-bg: #2c2e26; --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 14px rgba(0,0,0,0.25);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1b1d19; --bg-raised: #24261f; --ink: #ece9e0; --ink-soft: #a5a99c;
    --border: #383b32; --accent: #6cc4ac; --accent-soft: #23342d; --accent-ink: #a9e6d1;
    --chip-bg: #2c2e26; --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 14px rgba(0,0,0,0.25);
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Work Sans', system-ui, sans-serif; font-size: 15px; line-height: 1.45; }
  h1 { font-family: 'Fraunces', Georgia, serif; text-wrap: balance; margin: 0; }
  .tabular { font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; }

  .wrap { max-width: 720px; margin: 0 auto; padding: 0 0 80px; }

  header.top { position: sticky; top: 0; z-index: 20; background: var(--bg); border-bottom: 1px solid var(--border); padding: 16px 18px 12px; }
  header.top h1 { font-size: 22px; font-weight: 600; color: var(--accent-ink); }
  header.top .subtitle { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }

  input[type="search"] { width: 100%; font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-raised); color: var(--ink); margin-top: 12px; }

  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 10px 18px 4px; }
  .chip { flex: none; padding: 6px 12px; border-radius: 999px; background: var(--chip-bg); font-size: 12.5px; font-weight: 600; color: var(--ink-soft); cursor: pointer; white-space: nowrap; border: 1px solid transparent; }
  .chip.active { background: var(--accent-soft); color: var(--accent-ink); border-color: var(--accent); }

  main { padding: 4px 14px 0; }
  .cat-heading { font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-soft); margin: 22px 6px 8px; display: flex; align-items: center; gap: 8px; }
  .cat-heading::after { content: ""; flex: 1; height: 1px; background: var(--border); }

  .row-card { background: var(--bg-raised); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; box-shadow: var(--shadow); }
  .row-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
  .row-name { font-weight: 600; font-size: 14.5px; }
  .unit-badge { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: var(--chip-bg); color: var(--ink-soft); text-transform: uppercase; }
  .custo-display { font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; color: var(--accent-ink); text-align: right; white-space: nowrap; }
  .custo-display .label { display: block; font-family: 'Work Sans'; font-weight: 500; font-size: 10.5px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.03em; }

  .inputs-grid { display: grid; grid-template-columns: 1.1fr 1fr 1.2fr; gap: 8px; }
  .field label { display: block; font-size: 11px; color: var(--ink-soft); margin-bottom: 3px; font-weight: 600; }
  .field input { width: 100%; font: inherit; padding: 8px 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--ink); font-family: 'IBM Plex Mono', monospace; font-size: 14px; }
  .field input[data-role="fornecedor"] { font-family: 'Work Sans', sans-serif; }
  .field input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--ink-soft); }
  .empty-state h1 { font-size: 18px; color: var(--ink); margin-bottom: 6px; }

  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--accent-ink); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-size: 13px; font-weight: 600; box-shadow: var(--shadow); opacity: 0; pointer-events: none; transition: opacity 0.25s ease, transform 0.25s ease; z-index: 50; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
</style>

<div class="wrap">
  <header class="top">
    <h1>Preços de Insumos</h1>
    <div class="subtitle">La Bella Donna — atualize sempre que houver reajuste de fornecedor</div>
    <input type="search" id="searchInput" placeholder="Buscar insumo...">
  </header>
  <div id="chipsRow" class="chips"></div>
  <main id="mainArea">
    <div class="empty-state"><h1>Carregando…</h1></div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = "https://fwsvefewovxfdjytktxn.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ3c3ZlZmV3b3Z4ZmRqeXRrdHhuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2Nzg4MzMsImV4cCI6MjEwMzI1NDgzM30.hweZym6XaB1G1QCSFLXxE4Sm2JhC775XxW6nhtZ0APc";
const CATEGORY_ORDER = ["Embutidos", "Queijos", "Carnes", "Molhos", "Vegetais", "Outros"];

let insumos = [];
let activeCategory = 'Todos';
let searchTerm = '';

const $ = (sel, el = document) => el.querySelector(sel);
const $$ = (sel, el = document) => Array.from(el.querySelectorAll(sel));

function showToast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._h);
  showToast._h = setTimeout(() => t.classList.remove('show'), 1800);
}

async function sbFetch(path, opts = {}) {
  const headers = Object.assign({
    'apikey': SUPABASE_ANON_KEY,
    'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
    'Content-Type': 'application/json; charset=utf-8'
  }, opts.headers || {});
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, Object.assign({}, opts, { headers }));
  if (!res.ok) {
    const text = await res.text().catch(() => '');
    throw new Error('Supabase error ' + res.status + ': ' + text);
  }
  const ct = res.headers.get('content-type') || '';
  return ct.includes('application/json') ? res.json() : null;
}

function fmtMoney(n) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  return 'R$ ' + Number(n).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 4 });
}

async function loadData() {
  try {
    insumos = await sbFetch('insumos?select=*&ativo=eq.true&order=nome.asc');
    render();
  } catch (e) {
    $('#mainArea').innerHTML = '<div class="empty-state"><h1>Não consegui carregar</h1><p>' + e.message + '</p></div>';
  }
}

function buildChips() {
  const row = $('#chipsRow');
  const cats = ['Todos'].concat(CATEGORY_ORDER.filter(c => insumos.some(i => i.categoria === c)));
  row.innerHTML = cats.map(c => `<div class="chip ${c === activeCategory ? 'active' : ''}" data-cat="${c}">${c}</div>`).join('');
  $$('.chip', row).forEach(chip => {
    chip.addEventListener('click', () => { activeCategory = chip.dataset.cat; render(); });
  });
}

function render() {
  buildChips();
  const term = searchTerm.trim().toLowerCase();
  let list = insumos.filter(i => activeCategory === 'Todos' || i.categoria === activeCategory);
  if (term) list = list.filter(i => i.nome.toLowerCase().includes(term));

  const byCat = {};
  list.forEach(i => { const c = i.categoria || 'Outros'; (byCat[c] = byCat[c] || []).push(i); });
  const order = CATEGORY_ORDER.filter(c => byCat[c]).concat(Object.keys(byCat).filter(c => !CATEGORY_ORDER.includes(c)));

  if (!list.length) {
    $('#mainArea').innerHTML = '<div class="empty-state"><h1>Nada encontrado</h1></div>';
    return;
  }

  let html = '';
  order.forEach(cat => {
    html += `<div class="cat-heading">${cat}</div>`;
    byCat[cat].forEach(ins => {
      html += `
        <div class="row-card" data-insumo="${ins.id}">
          <div class="row-top">
            <div>
              <div class="row-name">${ins.nome}</div>
              <span class="unit-badge">${ins.unidade}</span>
            </div>
            <div class="custo-display" data-role="custo"><span class="label">Custo unit.</span>${fmtMoney(ins.custo_unitario)}</div>
          </div>
          <div class="inputs-grid">
            <div class="field">
              <label>Preço de compra (R$)</label>
              <input type="number" step="0.01" inputmode="decimal" data-role="preco" value="${ins.preco_compra ?? ''}">
            </div>
            <div class="field">
              <label>Qtd. por embalagem</label>
              <input type="number" step="0.001" inputmode="decimal" data-role="qtd" value="${ins.qtd_embalagem ?? ''}">
            </div>
            <div class="field">
              <label>Fornecedor</label>
              <input type="text" data-role="fornecedor" value="${ins.fornecedor ?? ''}">
            </div>
          </div>
        </div>`;
    });
  });

  $('#mainArea').innerHTML = html;
  $$('.row-card').forEach(wireRowCard);
}

function wireRowCard(card) {
  const insumoId = Number(card.dataset.insumo);
  const ins = insumos.find(i => i.id === insumoId);
  const precoInput = $('[data-role="preco"]', card);
  const qtdInput = $('[data-role="qtd"]', card);
  const fornecedorInput = $('[data-role="fornecedor"]', card);
  const custoDisplay = $('[data-role="custo"]', card);

  function recomputeCusto() {
    const preco = parseFloat(precoInput.value);
    const qtd = parseFloat(qtdInput.value);
    const custo = (!isNaN(preco) && !isNaN(qtd) && qtd !== 0) ? preco / qtd : null;
    custoDisplay.innerHTML = '<span class="label">Custo unit.</span>' + fmtMoney(custo);
    return custo;
  }

  async function save() {
    const preco = parseFloat(precoInput.value);
    const qtd = parseFloat(qtdInput.value);
    const custo = recomputeCusto();
    try {
      await sbFetch('insumos?id=eq.' + insumoId, {
        method: 'PATCH',
        headers: { 'Prefer': 'return=minimal' },
        body: JSON.stringify({
          preco_compra: isNaN(preco) ? null : preco,
          qtd_embalagem: isNaN(qtd) ? null : qtd,
          custo_unitario: custo ?? 0,
          fornecedor: fornecedorInput.value || null
        })
      });
      ins.preco_compra = preco; ins.qtd_embalagem = qtd; ins.custo_unitario = custo;
      showToast('Salvo: ' + ins.nome);
    } catch (e) {
      showToast('Erro ao salvar — tenta de novo');
    }
  }

  [precoInput, qtdInput].forEach(inp => inp.addEventListener('input', recomputeCusto));
  [precoInput, qtdInput, fornecedorInput].forEach(inp => inp.addEventListener('blur', save));
}

$('#searchInput').addEventListener('input', (e) => { searchTerm = e.target.value; render(); });
loadData();
</script>
