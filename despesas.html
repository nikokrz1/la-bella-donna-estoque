<title>Lançamentos</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

  :root {
    --bg: #f5f4ee; --bg-raised: #ffffff; --ink: #23271f; --ink-soft: #5b6157;
    --border: #dedad0; --accent: #2c6b5e; --accent-soft: #e3efe9; --accent-ink: #0f3a30;
    --danger: #b13a2f; --danger-soft: #fbe4e0; --chip-bg: #eceae1;
    --shadow: 0 1px 2px rgba(35,39,31,0.06), 0 4px 14px rgba(35,39,31,0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1d19; --bg-raised: #24261f; --ink: #ece9e0; --ink-soft: #a5a99c;
      --border: #383b32; --accent: #6cc4ac; --accent-soft: #23342d; --accent-ink: #a9e6d1;
      --danger: #e28579; --danger-soft: #3a221e; --chip-bg: #2c2e26;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 14px rgba(0,0,0,0.25);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1b1d19; --bg-raised: #24261f; --ink: #ece9e0; --ink-soft: #a5a99c;
    --border: #383b32; --accent: #6cc4ac; --accent-soft: #23342d; --accent-ink: #a9e6d1;
    --danger: #e28579; --danger-soft: #3a221e; --chip-bg: #2c2e26;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 14px rgba(0,0,0,0.25);
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Work Sans', system-ui, sans-serif; font-size: 15px; line-height: 1.45; }
  h1, h2 { font-family: 'Fraunces', Georgia, serif; text-wrap: balance; margin: 0; }
  .tabular { font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; }

  .wrap { max-width: 760px; margin: 0 auto; padding: 0 0 80px; }

  header.top { position: sticky; top: 0; z-index: 20; background: var(--bg); border-bottom: 1px solid var(--border); padding: 16px 18px 12px; }
  header.top h1 { font-size: 22px; font-weight: 600; color: var(--accent-ink); }
  header.top .subtitle { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }

  .tabs { display: flex; gap: 4px; background: var(--chip-bg); border-radius: 10px; padding: 3px; margin-top: 12px; }
  .tabs button { flex: 1; border: none; background: transparent; padding: 8px 10px; border-radius: 8px; font: inherit; font-weight: 600; font-size: 13.5px; color: var(--ink-soft); cursor: pointer; }
  .tabs button.active { background: var(--bg-raised); color: var(--accent-ink); box-shadow: var(--shadow); }

  main { padding: 16px 14px 0; }
  section.card { background: var(--bg-raised); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: var(--shadow); }
  section.card h2 { font-size: 15px; margin-bottom: 12px; }

  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .form-grid .full { grid-column: 1 / -1; }
  .field label { display: block; font-size: 11px; color: var(--ink-soft); margin-bottom: 4px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.02em; }
  .field input, .field select {
    width: 100%; font: inherit; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg); color: var(--ink);
  }
  .field input[type="number"] { font-family: 'IBM Plex Mono', monospace; }
  .field input:focus, .field select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  button.primary {
    font: inherit; font-weight: 700; font-size: 14px; background: var(--accent); color: var(--bg-raised);
    border: none; border-radius: 8px; padding: 11px 18px; cursor: pointer; margin-top: 14px; width: 100%;
  }
  button.secondary {
    font: inherit; font-weight: 600; font-size: 13px; background: var(--accent-soft); color: var(--accent-ink);
    border: 1px solid var(--accent); border-radius: 8px; padding: 8px 14px; cursor: pointer;
  }
  button.link-danger { font: inherit; font-size: 12px; font-weight: 600; background: none; border: none; color: var(--danger); cursor: pointer; }

  table.list { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.list th, table.list td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); }
  table.list th { color: var(--ink-soft); font-weight: 600; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.03em; }
  table.list td.valor { font-family: 'IBM Plex Mono', monospace; text-align: right; }
  table.list td.acao { text-align: right; }
  .table-scroll { overflow-x: auto; }

  .cat-badge { font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: var(--chip-bg); color: var(--ink-soft); }

  .empty-state { text-align: center; padding: 30px 10px; color: var(--ink-soft); font-size: 13px; }

  .funcionario-row { display: grid; grid-template-columns: 1.4fr 1fr 0.9fr; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--border); align-items: end; }
  .funcionario-row:last-child { border-bottom: none; }

  .toast {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    background: var(--accent-ink); color: var(--bg); padding: 9px 16px; border-radius: 999px;
    font-size: 13px; font-weight: 600; box-shadow: var(--shadow); opacity: 0; pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease; z-index: 50;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
</style>

<div class="wrap">
  <header class="top">
    <h1>Lançamentos</h1>
    <div class="subtitle">La Bella Donna — notas, funcionários e categorização pro DRE</div>
    <div class="tabs">
      <button class="active" data-tab="notas">Notas</button>
      <button data-tab="funcionarios">Funcionários</button>
      <button data-tab="historico">Histórico</button>
    </div>
  </header>
  <main id="mainArea"></main>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = "https://fwsvefewovxfdjytktxn.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ3c3ZlZmV3b3Z4ZmRqeXRrdHhuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2Nzg4MzMsImV4cCI6MjEwMzI1NDgzM30.hweZym6XaB1G1QCSFLXxE4Sm2JhC775XxW6nhtZ0APc";

const CATEGORIAS = {
  "CMV": ["MSX Food", "Delly's", "Duplex Papeis", "Cartão de Crédito (compras reais)"],
  "Despesas Operacionais": ["Folha+Encargos", "Estrutura", "Administrativo", "Sistema/Operacional", "Marketing", "Royalties/Outros"],
  "Despesas Financeiras": ["Rolagem de Dívida", "Taxas (Saipos/Stone/iFood)"]
};

let activeTab = 'notas';
let despesasCache = [];
let funcionariosCache = [];
let fornecedoresCache = [];
const NOVO_FORNECEDOR = '__novo__';

const $ = (sel, el = document) => el.querySelector(sel);
const $$ = (sel, el = document) => Array.from(el.querySelectorAll(sel));

function todayISO() { return new Date().toISOString().slice(0, 10); }

function showToast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._h);
  showToast._h = setTimeout(() => t.classList.remove('show'), 1800);
}

async function sbFetch(path, opts = {}) {
  const headers = Object.assign({
    'apikey': SUPABASE_ANON_KEY,
    'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
    'Content-Type': 'application/json; charset=utf-8'
  }, opts.headers || {});
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, Object.assign({}, opts, { headers }));
  if (!res.ok) {
    const text = await res.text().catch(() => '');
    throw new Error('Supabase error ' + res.status + ': ' + text);
  }
  const ct = res.headers.get('content-type') || '';
  return ct.includes('application/json') ? res.json() : null;
}

function fmtMoney(n) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  return Number(n).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}

// ---------- NOTAS ----------
function renderNotas() {
  $('#mainArea').innerHTML = `
    <section class="card">
      <h2>Nova despesa</h2>
      <div class="form-grid">
        <div class="field"><label>Data (competência)</label><input type="date" id="fData" value="${todayISO()}"></div>
        <div class="field"><label>Valor (R$)</label><input type="number" step="0.01" id="fValor" placeholder="0,00"></div>
        <div class="field"><label>Categoria</label>
          <select id="fCategoria">${Object.keys(CATEGORIAS).map(c => `<option value="${c}">${c}</option>`).join('')}</select>
        </div>
        <div class="field"><label>Subcategoria</label><select id="fSubcategoria"></select></div>
        <div class="field full"><label>Descrição</label><input type="text" id="fDescricao" placeholder="Ex: compra de embalagens"></div>
        <div class="field"><label>Fornecedor (opcional)</label><select id="fFornecedor"><option value="">—</option></select></div>
        <div class="field"><label>Forma de pagamento</label>
          <select id="fForma">
            <option value="">—</option>
            <option>Dinheiro</option><option>Pix</option><option>Cartão de Débito</option>
            <option>Cartão de Crédito</option><option>Boleto</option><option>Transferência</option>
          </select>
        </div>
      </div>
      <button class="primary" id="btnLancar">Lançar despesa</button>
    </section>
    <section class="card">
      <h2>Últimos lançamentos</h2>
      <div id="recentList"><div class="empty-state">Carregando…</div></div>
    </section>
  `;

  const catSelect = $('#fCategoria');
  const subSelect = $('#fSubcategoria');
  function fillSub() {
    subSelect.innerHTML = CATEGORIAS[catSelect.value].map(s => `<option value="${s}">${s}</option>`).join('');
  }
  catSelect.addEventListener('change', fillSub);
  fillSub();
  loadFornecedores();
  $('#fFornecedor').addEventListener('change', onFornecedorChange);

  $('#btnLancar').addEventListener('click', async () => {
    const valor = parseFloat($('#fValor').value);
    if (isNaN(valor) || valor <= 0) { showToast('Informe um valor válido'); return; }
    const payload = {
      data: $('#fData').value,
      categoria: catSelect.value,
      subcategoria: subSelect.value,
      descricao: $('#fDescricao').value || null,
      valor: valor,
      fornecedor: (fSelected => fSelected && fSelected !== NOVO_FORNECEDOR ? fSelected : null)($('#fFornecedor').value),
      forma_pagamento: $('#fForma').value || null,
      origem: 'nota'
    };
    try {
      await sbFetch('despesas', { method: 'POST', headers: { 'Prefer': 'return=minimal' }, body: JSON.stringify([payload]) });
      showToast('Lançado: ' + payload.subcategoria + ' — ' + fmtMoney(valor));
      $('#fValor').value = ''; $('#fDescricao').value = ''; $('#fFornecedor').value = '';
      $('#fForma').value = '';
      loadRecent();
    } catch (e) {
      showToast('Erro ao lançar — tenta de novo');
    }
  });

  loadRecent();
}

async function loadFornecedores() {
  try {
    fornecedoresCache = await sbFetch('fornecedores?select=*&ativo=eq.true&order=nome.asc');
  } catch (e) {
    fornecedoresCache = [];
  }
  const sel = $('#fFornecedor');
  if (!sel) return;
  sel.innerHTML = '<option value="">—</option>'
    + fornecedoresCache.map(f => `<option value="${f.nome}">${f.nome}</option>`).join('')
    + `<option value="${NOVO_FORNECEDOR}">+ Novo fornecedor...</option>`;
}

async function onFornecedorChange() {
  const sel = $('#fFornecedor');
  if (sel.value !== NOVO_FORNECEDOR) return;
  const nome = prompt('Nome do novo fornecedor:');
  if (!nome || !nome.trim()) { sel.value = ''; return; }
  try {
    await sbFetch('fornecedores', { method: 'POST', headers: { 'Prefer': 'return=minimal' }, body: JSON.stringify([{ nome: nome.trim() }]) });
    await loadFornecedores();
    sel.value = nome.trim();
    showToast('Fornecedor criado: ' + nome.trim());
  } catch (e) {
    showToast('Erro ao criar fornecedor (já existe?)');
    sel.value = '';
  }
}

async function loadRecent() {
  try {
    despesasCache = await sbFetch('despesas?select=*&order=data.desc,lancado_em.desc&limit=25');
    renderRecentTable('#recentList', despesasCache);
  } catch (e) {
    $('#recentList').innerHTML = '<div class="empty-state">Não consegui carregar.</div>';
  }
}

function renderRecentTable(target, rows) {
  const el = $(target);
  if (!rows.length) { el.innerHTML = '<div class="empty-state">Nenhum lançamento ainda.</div>'; return; }
  const total = rows.reduce((s, r) => s + Number(r.valor), 0);
  el.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;">
      <span style="font-size:12px;color:var(--ink-soft);">${rows.length} lançamento(s)</span>
      <span style="font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:15px;color:var(--accent-ink);">Total: ${fmtMoney(total)}</span>
    </div>
    <div class="table-scroll"><table class="list"><thead><tr>
    <th>Data</th><th>Categoria</th><th>Descrição</th><th>Valor</th><th></th>
  </tr></thead><tbody>${rows.map(r => `
    <tr data-id="${r.id}">
      <td>${r.data.split('-').reverse().join('/')}</td>
      <td><span class="cat-badge">${r.subcategoria}</span></td>
      <td>${r.descricao || r.fornecedor || '—'}</td>
      <td class="valor">${fmtMoney(r.valor)}</td>
      <td class="acao"><button class="link-danger" data-role="del">excluir</button></td>
    </tr>`).join('')}</tbody></table></div>`;
  $$('[data-role="del"]', el).forEach(btn => {
    btn.addEventListener('click', async (e) => {
      const tr = e.target.closest('tr');
      const id = tr.dataset.id;
      if (!confirm('Excluir esse lançamento?')) return;
      await sbFetch('despesas?id=eq.' + id, { method: 'DELETE' });
      showToast('Excluído');
      loadRecent();
    });
  });
}

// ---------- FUNCIONÁRIOS ----------
function renderFuncionarios() {
  $('#mainArea').innerHTML = `
    <section class="card">
      <h2>Cadastro de funcionários</h2>
      <div id="funcList"><div class="empty-state">Carregando…</div></div>
      <button class="secondary" id="btnAddFunc" style="margin-top:12px;">+ Adicionar funcionário</button>
    </section>
    <section class="card">
      <h2>Lançar folha do mês</h2>
      <div class="form-grid">
        <div class="field"><label>Mês de referência</label><input type="month" id="folhaMes" value="${todayISO().slice(0,7)}"></div>
      </div>
      <button class="primary" id="btnFolha">Lançar folha de todos os ativos</button>
      <div id="folhaResult"></div>
    </section>
  `;
  loadFuncionarios();
  $('#btnAddFunc').addEventListener('click', async () => {
    const nome = prompt('Nome do funcionário:');
    if (!nome) return;
    await sbFetch('funcionarios', { method: 'POST', headers: { 'Prefer': 'return=minimal' }, body: JSON.stringify([{ nome, custo_mensal: 0, ativo: true }]) });
    loadFuncionarios();
  });
  $('#btnFolha').addEventListener('click', lancarFolha);
}

async function loadFuncionarios() {
  try {
    funcionariosCache = await sbFetch('funcionarios?select=*&order=nome.asc');
  } catch (e) {
    $('#funcList').innerHTML = '<div class="empty-state">Não consegui carregar.</div>';
    return;
  }
  const el = $('#funcList');
  if (!funcionariosCache.length) { el.innerHTML = '<div class="empty-state">Nenhum funcionário cadastrado.</div>'; return; }
  el.innerHTML = funcionariosCache.map(f => `
    <div class="funcionario-row" data-id="${f.id}">
      <div class="field"><label>Nome</label><input type="text" data-role="nome" value="${f.nome}"></div>
      <div class="field"><label>Cargo</label><input type="text" data-role="cargo" value="${f.cargo || ''}"></div>
      <div class="field"><label>Custo mensal (R$)</label><input type="number" step="0.01" data-role="custo" value="${f.custo_mensal}"></div>
    </div>`).join('');
  $$('.funcionario-row', el).forEach(row => {
    const id = row.dataset.id;
    ['nome', 'cargo', 'custo'].forEach(role => {
      $(`[data-role="${role}"]`, row).addEventListener('blur', async (e) => {
        const field = role === 'custo' ? 'custo_mensal' : role;
        const value = role === 'custo' ? parseFloat(e.target.value) || 0 : e.target.value;
        await sbFetch('funcionarios?id=eq.' + id, { method: 'PATCH', headers: { 'Prefer': 'return=minimal' }, body: JSON.stringify({ [field]: value }) });
        showToast('Salvo');
      });
    });
  });
}

async function lancarFolha() {
  const mesRef = $('#folhaMes').value; // "YYYY-MM"
  if (!mesRef) return;
  const dataCompetencia = mesRef + '-01';
  const ativos = funcionariosCache.filter(f => f.ativo);
  if (!ativos.length) { showToast('Nenhum funcionário ativo'); return; }

  const existentes = await sbFetch(`despesas?select=funcionario_id&origem=eq.funcionario&data=eq.${dataCompetencia}`);
  const jaLancados = new Set(existentes.map(e => e.funcionario_id));
  const aLancar = ativos.filter(f => !jaLancados.has(f.id));

  if (!aLancar.length) { $('#folhaResult').innerHTML = '<p style="color:var(--ink-soft);font-size:13px;margin-top:10px;">Todos os funcionários ativos já têm folha lançada nesse mês.</p>'; return; }

  const payload = aLancar.map(f => ({
    data: dataCompetencia,
    categoria: 'Despesas Operacionais',
    subcategoria: 'Folha+Encargos',
    descricao: f.nome + (f.cargo ? ' (' + f.cargo + ')' : ''),
    valor: f.custo_mensal,
    funcionario_id: f.id,
    origem: 'funcionario'
  }));
  await sbFetch('despesas', { method: 'POST', headers: { 'Prefer': 'return=minimal' }, body: JSON.stringify(payload) });
  const total = aLancar.reduce((s, f) => s + Number(f.custo_mensal), 0);
  $('#folhaResult').innerHTML = `<p style="color:var(--accent-ink);font-size:13px;margin-top:10px;font-weight:600;">Lançado: ${aLancar.length} funcionário(s), total ${fmtMoney(total)}.</p>`;
  showToast('Folha lançada');
}

// ---------- HISTÓRICO ----------
function renderHistorico() {
  const from = new Date(); from.setDate(from.getDate() - 60);
  $('#mainArea').innerHTML = `
    <section class="card">
      <h2>Histórico de lançamentos</h2>
      <div class="form-grid">
        <div class="field"><label>De</label><input type="date" id="histFrom" value="${from.toISOString().slice(0,10)}"></div>
        <div class="field"><label>Até</label><input type="date" id="histTo" value="${todayISO()}"></div>
        <div class="field"><label>Categoria</label>
          <select id="histCat"><option value="">Todas</option>${Object.keys(CATEGORIAS).map(c => `<option value="${c}">${c}</option>`).join('')}</select>
        </div>
        <div class="field"><label>Subcategoria</label>
          <select id="histSub"><option value="">Todas</option></select>
        </div>
      </div>
      <div id="histList" style="margin-top:14px;"><div class="empty-state">Carregando…</div></div>
    </section>
  `;
  const subSelect = $('#histSub');
  function fillHistSub() {
    const cat = $('#histCat').value;
    const opts = cat ? CATEGORIAS[cat] : Object.values(CATEGORIAS).flat();
    subSelect.innerHTML = '<option value="">Todas</option>' + opts.map(s => `<option value="${s}">${s}</option>`).join('');
  }
  fillHistSub();

  const load = async () => {
    const from = $('#histFrom').value, to = $('#histTo').value, cat = $('#histCat').value, sub = subSelect.value;
    let path = `despesas?select=*&data=gte.${from}&data=lte.${to}&order=data.desc`;
    if (cat) path += `&categoria=eq.${encodeURIComponent(cat)}`;
    if (sub) path += `&subcategoria=eq.${encodeURIComponent(sub)}`;
    const rows = await sbFetch(path);
    renderRecentTable('#histList', rows);
  };
  $('#histFrom').addEventListener('change', load);
  $('#histTo').addEventListener('change', load);
  $('#histCat').addEventListener('change', () => { fillHistSub(); load(); });
  $('#histSub').addEventListener('change', load);
  load();
}

function render() {
  if (activeTab === 'notas') renderNotas();
  else if (activeTab === 'funcionarios') renderFuncionarios();
  else renderHistorico();
}

$$('.tabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    $$('.tabs button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeTab = btn.dataset.tab;
    render();
  });
});

render();
</script>
